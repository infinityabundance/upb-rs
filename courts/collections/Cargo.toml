[package]
name = "court-collections"
version = "0.1.0"
edition = "2021"
description = "Differential court: upb_Array and upb_Map primitives (array arena accounting + content; map content semantics) vs the Rust Array/Map models"

[dependencies]
upb-rs-casefile = { version = "0.1.0", path = "../../crates/upb-rs-casefile" }
