[package]
name = "upb-rs"
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Custodial native-Rust reimplementation of Google's upb (μpb) protobuf runtime, engineered for observable-behavior parity against pinned upstream"
keywords = ["protobuf", "upb", "protobuf-runtime", "wire-format", "parity"]
categories = ["encoding", "parser-implementations", "no-std"]

[dependencies]
upb-rs-core = { version = "0.1.0", path = "../upb-rs-core" }
upb-rs-wire = { version = "0.1.2", path = "../upb-rs-wire" }
upb-rs-oracle = { version = "0.1.2", path = "../upb-rs-oracle" }
upb-rs-casefile = { version = "0.1.0", path = "../upb-rs-casefile" }
upb-rs-mini-table = { version = "0.1.0", path = "../upb-rs-mini-table" }
