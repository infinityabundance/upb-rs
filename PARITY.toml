note = "linked sub-message decode: singular (merge semantics), repeated, nested, recursive (self- and mutual links), oneof members (switch clears, re-set merges), depth budget 99/100/101 boundaries (MaxDepthExceeded), truncations at every offset, size/budget overruns, unknown fields inside sub-messages, unlinked slots (decode as unknown), packed-inside-sub. 93/93 cases equal. Court caught and sealed the oneof-case-word dump regression (casefile oneof-case-word-dump). Deferred: maps, groups, closed enums."

