[arena]
status = "parity-sealed"
oracle = "protobuf:2de70d710510ea7c5ad7ec0c72bfed7f411c7b60"
court = "arena-v1"
residuals = 0
note = "ArenaPool vs real upb_Arena: allocation traces (malloc/realloc/shrink/try-extend), exponential block growth + one-off blocks, OOM injection, initial-block/fixed-size modes, space_allocated accounting, cleanup registration + fused-lifetime free, fuse refusal for initial-block arenas. 61/61 cases equal."

[arrays]
status = "parity-sealed"
oracle = "protobuf:2de70d710510ea7c5ad7ec0c72bfed7f411c7b60"
court = "collections-v1"
residuals = 0
note = "upb_Array: new (arena footprint 24 + 4<<lg2), append, set, resize, get; capacity doubling via arena realloc (in-place when last alloc); zero-fill on grow-resize; data hex + space accounting per op. Numeric ctypes only (string arrays out of court scope). 52/52 cases equal. Divergence documented: set at index >= capacity is refused (upstream heap overflow, §49)."

[maps]
status = "parity-sealed"
oracle = "protobuf:2de70d710510ea7c5ad7ec0c72bfed7f411c7b60"
court = "collections-v1"
residuals = 0
note = "upb_Map content semantics: insert (last-wins, inserted/replaced status), get, delete, iterate; bool/uint32/double/string keys and values incl. hostile bit patterns. The map's internal table layout and arena footprint are representation; iteration is compared as a sorted set (NONDETERMINISM.md). 52/52 cases equal (map cases share the collections-v1 run). Court exposed an oracle-emitter bug (iterate must start at kUpb_Map_Begin)."

